<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16112a">
  <meta name="description" content="425種類のスキンシップから、今日のお題をランダムにひとつ。カテゴリー選択・重複防止・コピー対応。">
  <title>ふれあいルーレット | 425のお題</title>
  <style>
    :root {
      color-scheme: dark;
      --bg:#16112a; --panel:#231b3e; --panel2:#2b214b; --text:#f9f4ff;
      --muted:#bcb0d3; --line:rgba(255,255,255,.13); --pink:#ff7cac; --peach:#ffc4b9;
      --lav:#c6a8ff; --accent:#ff95b4; --shadow:0 28px 85px rgba(10,5,25,.45);
    }
    *{box-sizing:border-box}
    html{min-height:100%;scroll-behavior:smooth}
    body{margin:0;min-height:100dvh;overflow-x:hidden;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Hiragino Sans",Meiryo,sans-serif;
      background:radial-gradient(ellipse 65% 55% at 5% 0%,rgba(170,99,197,.20),transparent 80%),
      radial-gradient(ellipse 70% 58% at 100% 45%,rgba(255,120,154,.12),transparent 80%),
      linear-gradient(160deg,#1a1230 5%,#151027 57%,#1d142e 100%);color:var(--text);}
    .orb{position:fixed;border-radius:100%;filter:blur(50px);pointer-events:none;opacity:.28;z-index:0}
    .orb.one{width:270px;height:270px;background:#b97cff;top:9%;left:-180px}
    .orb.two{width:330px;height:330px;background:#ff78ac;bottom:-130px;right:-180px}
    .wrap{position:relative;z-index:1;max-width:620px;min-height:100dvh;margin:auto;padding:35px 22px 35px;display:flex;flex-direction:column}
    header{text-align:center;margin:12px 0 26px}
    .eyebrow{display:inline-flex;align-items:center;gap:9px;letter-spacing:.19em;text-transform:uppercase;font-size:11px;font-weight:800;color:#ebbad7}
    .eyebrow .spark{font-size:17px;color:var(--peach)}
    h1{font-size:clamp(30px,6.7vw,43px);font-weight:850;letter-spacing:.015em;line-height:1.25;margin:11px 0 10px}
    h1 .shine{background:linear-gradient(105deg,#ffc5d5,#ffd6bd 52%,#d6bbff);background-clip:text;-webkit-background-clip:text;color:transparent}
    .subtitle{font-size:13px;color:var(--muted);line-height:1.8;margin:0}
    .card{position:relative;isolation:isolate;border:1px solid rgba(255,255,255,.20);border-radius:28px;
      background:linear-gradient(150deg,rgba(66,45,93,.96),rgba(36,27,65,.97) 65%,rgba(45,29,63,.97));
      box-shadow:var(--shadow);overflow:hidden;padding:29px 27px 27px;min-height:287px;display:flex;align-items:center;flex-direction:column;justify-content:center;text-align:center}
    .card:before{content:'';position:absolute;z-index:-1;inset:0;background:radial-gradient(ellipse 100% 70% at 50% -25%,rgba(255,168,201,.22),transparent 80%)}
    .card:after{content:'';position:absolute;z-index:-1;width:270px;height:270px;right:-120px;bottom:-190px;background:rgba(158,106,224,.12);border-radius:50%;filter:blur(10px)}
    .card .card-label{font-size:10px;letter-spacing:.24em;font-weight:800;color:#e7c2e2;opacity:.9}
    .card .heart{font-size:30px;line-height:1;margin:17px 0 14px;color:#ffa4bf;filter:drop-shadow(0 0 10px rgba(255,124,172,.38))}
    .card .prompt{font-size:clamp(22px,5.5vw,31px);font-weight:780;line-height:1.55;letter-spacing:.025em;min-height:92px;display:flex;align-items:center;justify-content:center;word-break:normal;overflow-wrap:anywhere;text-wrap:balance}
    .card .meta{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px;margin-top:18px}
    .pill{padding:8px 13px;font-size:11px;font-weight:750;letter-spacing:.03em;border-radius:99px;background:rgba(255,255,255,.09);color:#ead7f2;border:1px solid rgba(255,255,255,.1)}
    .pill.no{color:#ffd2df;background:rgba(255,128,177,.11)}
    .card.enter .heart,.card.enter .prompt,.card.enter .meta{animation:rise .34s cubic-bezier(.2,.8,.25,1) both}
    .card.enter .prompt{animation-delay:.045s}.card.enter .meta{animation-delay:.08s}
    @keyframes rise{from{transform:translateY(10px);opacity:0}to{transform:translateY(0);opacity:1}}
    .primary{width:100%;height:64px;display:flex;align-items:center;justify-content:center;gap:12px;border:0;border-radius:20px;
      color:#32182f;font-family:inherit;font-size:17px;font-weight:850;letter-spacing:.06em;cursor:pointer;margin-top:18px;
      background:linear-gradient(110deg,#ffb1c5 0%,#ffccba 51%,#ffb7d9 100%);box-shadow:0 10px 30px rgba(255,124,172,.22);
      transition:transform .17s ease,box-shadow .17s ease;}
    .primary:hover{transform:translateY(-2px);box-shadow:0 13px 35px rgba(255,124,172,.29)}
    .primary:active{transform:translateY(1px)}
    .primary:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #ffd3e2;outline-offset:3px}
    .primary svg{width:22px;height:22px;stroke-width:2.2}
    .controls{display:flex;align-items:center;justify-content:space-between;gap:11px;margin:15px 2px 24px}
    .secondary{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);border-radius:13px;background:rgba(255,255,255,.045);
      color:#e7dff4;padding:11px 13px;font:700 12px inherit;white-space:nowrap;cursor:pointer;transition:background .15s}
    .secondary:hover{background:rgba(255,255,255,.09)}
    .secondary:disabled{opacity:.42;cursor:not-allowed}
    .secondary svg{width:16px;height:16px}
    .remaining{font-size:12px;color:var(--muted);text-align:center;white-space:nowrap;font-variant-numeric:tabular-nums}
    .settings{border:1px solid var(--line);background:rgba(31,23,53,.67);border-radius:23px;padding:21px 20px 19px}
    .section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:17px}
    .section-head h2{font-size:14px;letter-spacing:.04em;margin:0}
    .section-head .hint{font-size:11px;color:var(--muted)}
    label.setting-label{display:block;margin-bottom:8px;font-size:12px;font-weight:750;color:#dccfe9}
    .select-wrap{position:relative}
    select{width:100%;height:48px;appearance:none;-webkit-appearance:none;border:1px solid rgba(255,255,255,.18);border-radius:13px;
      color:var(--text);background:#342849;padding:0 38px 0 14px;font-family:inherit;font-size:14px;cursor:pointer}
    .chevron{position:absolute;right:15px;top:18px;pointer-events:none;border-right:2px solid #dbc6ec;border-bottom:2px solid #dbc6ec;width:8px;height:8px;transform:rotate(45deg)}
    .checkrow{display:flex;gap:12px;align-items:flex-start;cursor:pointer;margin-top:17px;color:var(--text)}
    .checkrow input{appearance:none;-webkit-appearance:none;width:20px;height:20px;flex:none;margin:1px 0 0;border:1px solid #a388c1;border-radius:6px;background:#302444;cursor:pointer;position:relative}
    .checkrow input:checked{background:linear-gradient(120deg,#ff9bc0,#c1a4fb);border-color:transparent}
    .checkrow input:checked:after{content:'✓';position:absolute;left:4px;top:-1px;font-size:15px;font-weight:900;color:#281633}
    .checkrow .main{display:block;font-size:13px;font-weight:700;line-height:1.45}
    .checkrow .sub{display:block;font-size:11px;color:var(--muted);margin-top:3px;line-height:1.5}
    .setting-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:1px solid var(--line);margin-top:19px;padding-top:15px}
    .setting-foot span{font-size:11px;color:var(--muted)}
    .text-button{border:0;background:none;padding:4px 0;color:#f2bdd3;font-family:inherit;font-weight:750;font-size:11px;cursor:pointer}
    .text-button:hover{text-decoration:underline}
    .history{margin-top:22px}
    .history h2{font-size:13px;color:#eadced;margin:0 0 12px;display:flex;justify-content:space-between;align-items:center}
    .history h2 span{font-weight:450;color:var(--muted);font-size:11px}
    .history-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
    .history-item{display:flex;align-items:center;gap:12px;border:1px solid rgba(255,255,255,.08);border-radius:12px;background:rgba(255,255,255,.035);padding:12px 13px}
    .history-item .num{font-variant-numeric:tabular-nums;font-size:11px;font-weight:800;color:#e6b9d8;min-width:35px}
    .history-item .name{font-size:12px;color:#dcd1ea;line-height:1.5}
    .empty-history{border:1px dashed rgba(255,255,255,.16);border-radius:12px;text-align:center;padding:18px 10px;color:var(--muted);font-size:12px}
    footer{margin-top:auto;padding-top:24px;text-align:center;color:#a599be;font-size:10px;line-height:1.8}
    .toast{position:fixed;z-index:10;left:50%;bottom:26px;transform:translate(-50%,20px);opacity:0;pointer-events:none;padding:11px 19px;border-radius:999px;
      background:#f8deeb;color:#31233d;font-size:12px;font-weight:800;box-shadow:0 10px 40px rgba(0,0,0,.3);transition:opacity .2s,transform .2s;white-space:nowrap}
    .toast.show{opacity:1;transform:translate(-50%,0)}
    @media (max-width:420px){.wrap{padding:24px 16px 25px}header{margin:8px 0 22px}.card{min-height:282px;padding:24px 18px}.controls{gap:6px}.secondary{font-size:11px;padding:10px 11px}.remaining{font-size:11px}}
    @media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
  </style>
</head>
<body>
  <div class="orb one" aria-hidden="true"></div><div class="orb two" aria-hidden="true"></div>
  <main class="wrap">
    <header>
      <div class="eyebrow"><span class="spark">✦</span> TOUCH PROMPT GENERATOR <span class="spark">✦</span></div>
      <h1>ふれあい<span class="shine">ルーレット</span></h1>
      <p class="subtitle">425種類のスキンシップから、今日のお題をひとつ。<br>ふたりのペースで、気軽に楽しもう ♡</p>
    </header>

    <section aria-label="抽選されたお題" class="card" id="promptCard">
      <div class="card-label">TODAY'S TOUCH</div>

      <div class="prompt" id="prompt" aria-live="polite" aria-atomic="true">ボタンを押して<br>お題を引いてみよう</div>
      <div class="meta" id="meta"><span class="pill">全425種類のお題</span></div>
    </section>

    <button id="drawBtn" class="primary" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4v6h6M20 20v-6h-6"/><path d="M20 8a8 8 0 0 0-14-2L4 10M4 16a8 8 0 0 0 14 2l2-4"/></svg>
      お題をひとつ引く

    <div class="controls">

      <span class="remaining" id="remaining" aria-live="polite">あと 425 / 425 種類</span>

    </div>

    <section class="settings" aria-labelledby="settingTitle">
      <div class="section-head"><h2 id="settingTitle">⚙️ 抽選の設定</h2><span class="hint" id="totalLabel">425種類から抽選</span></div>
      <label for="category" class="setting-label">カテゴリ</label>
      <div class="select-wrap"><select id="category"><option value="all">すべてのカテゴリ（全425種類）</option></select><span class="chevron" aria-hidden="true"></span></div>
      <label class="checkrow"><input id="includeFantasy" type="checkbox" checked><span><span class="main">ファンタジーのお題も含める</span><span class="sub">獣耳・尻尾・翼などの異種族向けのお題</span></span></label>
      <label class="checkrow"><input id="avoidRepeat" type="checkbox" checked><span><span class="main">同じお題は一巡するまで出さない</span><span class="sub">対象のお題を全部引いたら、自動で一巡目に戻る</span></span></label>
      <div class="setting-foot"><span>番号と文章は元のリストに準拠</span><button type="button" class="text-button" id="resetBtn">抽選履歴をリセット</button></div>
    </section>

    <section class="history" aria-label="最近引いたお題">
      <h2>最近のお題 <span>直近5件</span></h2>
      <ol class="history-list" id="historyList"><li class="empty-history">まだお題はありません</li></ol>
    </section>
    <footer>お互いの同意を大切に。無理のない範囲で楽しんでね。<br>オフラインで動作・外部へのデータ送信なし</footer>
  </main>

,"text":"翼に包まれて眠る","category":12},{"id":362,"text":"羽毛に頬を埋める","category":12},{"id":363,"text":"羽毛を優しく梳く","category":12},{"id":364,"text":"角を優しく撫でる","category":12},{"id":365,"text":"角の根元を指先で触れる","category":12},{"id":366,"text":"角同士を軽く合わせる","category":12},{"id":367,"text":"角に額を寄せる","category":12},{"id":368,"text":"角を磨いてあげる","category":12},{"id":369,"text":"鱗を優しく撫でる","category":12},{"id":370,"text":"鱗の模様を指でなぞる","category":12},{"id":371,"text":"鱗の手入れをしてあげる","category":12},{"id":372,"text":"鱗のある頬に頬ずりする","category":12},{"id":373,"text":"大きな爪のある手を両手で包む","category":12},{"id":374,"text":"肉球を優しく触る","category":12},{"id":375,"text":"肉球同士を合わせる","category":12},{"id":376,"text":"肉球をぷにぷにする","category":12},{"id":377,"text":"毛並みをブラッシングする","category":12},{"id":378,"text":"たてがみに顔を埋める","category":12},{"id":379,"text":"たてがみを梳いてあげる","category":12},{"id":380,"text":"長い耳を優しく整える","category":12},{"id":381,"text":"触角同士を触れ合わせる","category":12},{"id":382,"text":"触角で相手の額に触れる","category":12},{"id":383,"text":"触手で優しく手をつなぐ","category":12},{"id":384,"text":"複数の腕で相手を包み込む","category":12},{"id":385,"text":"大きな体で小さな恋人を包み込む","category":12},{"id":386,"text":"小さな恋人を手のひらに乗せる","category":12},{"id":387,"text":"巨体の恋人の指に抱きつく","category":12},{"id":388,"text":"巨体の恋人の鼻先にキスする","category":12},{"id":389,"text":"小さな恋人を肩に乗せて頬を寄せる","category":12},{"id":390,"text":"大きな尻尾を枕にする","category":12},{"id":391,"text":"ふわふわの尻尾にくるまる","category":12},{"id":392,"text":"翼と腕を同時に使って抱きしめる","category":12},{"id":393,"text":"魔法で温めた手を重ねる","category":12},{"id":394,"text":"魔法で生み出した柔らかな光の中で抱き合う","category":12},{"id":395,"text":"互いの魔力を感じるために手のひらを合わせる","category":12},{"id":396,"text":"告白のあとに手を握る","category":13},{"id":397,"text":"告白のあとに抱きしめる","category":13},{"id":398,"text":"初めて恋人つなぎをする","category":13},{"id":399,"text":"初めて頬にキスする","category":13},{"id":400,"text":"初めて唇にキスする","category":13},{"id":401,"text":"記念日に長く抱きしめる","category":13},{"id":402,"text":"誕生日に抱きつく","category":13},{"id":403,"text":"プレゼントを渡したあとにハグする","category":13},{"id":404,"text":"サプライズの成功を喜んで抱き合う","category":13},{"id":405,"text":"嬉しい報告を聞いて手を握る","category":13},{"id":406,"text":"喜びのあまり飛びついて抱きつく","category":13},{"id":407,"text":"落ち込んだ相手の手をそっと取る","category":13},{"id":408,"text":"謝罪するときに相手の手を握る","category":13},{"id":409,"text":"仲直りして抱き合う","category":13},{"id":410,"text":"再会して頬を寄せ合う","category":13},{"id":411,"text":"久しぶりの再会で長く抱きしめる","category":13},{"id":412,"text":"別れ際に手を離すのを惜しむ","category":13},{"id":413,"text":"別れ際にもう一度抱きしめる","category":13},{"id":414,"text":"旅立つ相手の額にキスする","category":13},{"id":415,"text":"帰宅した相手を抱きしめて迎える","category":13},{"id":416,"text":"プロポーズのあとに手を重ねる","category":13},{"id":417,"text":"指輪をはめた手にキスする","category":13},{"id":418,"text":"結婚式で頬を寄せ合う","category":13},{"id":419,"text":"星空を眺めながら肩を抱く","category":13},{"id":420,"text":"花火を見ながら手をつなぐ","category":13},{"id":421,"text":"雪景色の中で抱き合う","category":13},{"id":422,"text":"雨音を聞きながら寄り添う","category":13},{"id":423,"text":"朝日を見ながら額を合わせる","category":13},{"id":424,"text":"夕日を眺めながら腰に腕を回す","category":13},{"id":425,"text":"眠る前に一日の感謝を込めてハグする","category":13}],"categories":[{"id":1,"name":"手・指","start":1,"end":30},{"id":2,"name":"ハグ・抱擁","start":31,"end":65},{"id":3,"name":"キス","start":66,"end":105},{"id":4,"name":"顔・頬","start":106,"end":130},{"id":5,"name":"髪・頭","start":131,"end":155},{"id":6,"name":"座位","start":156,"end":185},{"id":7,"name":"添い寝・睡眠","start":186,"end":215},{"id":8,"name":"甘える・じゃれ合う","start":216,"end":245},{"id":9,"name":"ロマンチックな接触","start":246,"end":275},{"id":10,"name":"甘やかす・癒やす","start":276,"end":305},{"id":11,"name":"日常生活","start":306,"end":335},{"id":12,"name":"異種族・ファンタジー","start":336,"end":395},{"id":13,"name":"特別な場面・感情表現","start":396,"end":425}]}</script>
  <script>
  (()=>{
    'use strict';
    const {items,categories}=JSON.parse(document.getElementById('sourceData').textContent);
    const byId=new Map(items.map(item=>[item.id,item]));
    const byCategory=new Map(categories.map(c=>[c.id,c]));
    const $=id=>document.getElementById(id);
    const els={card:$('promptCard'),prompt:$('prompt'),meta:$('meta'),remaining:$('remaining'),totalLabel:$('totalLabel'),
      category:$('category'),includeFantasy:$('includeFantasy'),avoidRepeat:$('avoidRepeat'),historyList:$('historyList'),copyBtn:$('copyBtn'),backBtn:$('backBtn'),toast:$('toast')};
    let drawn=[],timeline=[],current=null,toastTimer;
    const key='fureai_roulette_v1';
    const pad=n=>String(n).padStart(3,'0');
    const load=()=>{try{const s=JSON.parse(localStorage.getItem(key)||'null');return s&&typeof s==='object'?s:null}catch{return null}};
    const save=()=>{try{localStorage.setItem(key,JSON.stringify({drawn,timeline,category:els.category.value,includeFantasy:els.includeFantasy.checked,avoidRepeat:els.avoidRepeat.checked,current:current?.id??null}))}catch{}};
    const saved=load();
    for(const cat of categories){const o=document.createElement('option');o.value=cat.id;o.textContent=`${String(cat.id).padStart(2,'0')} ${cat.name}（${cat.end-cat.start+1}種類）`;els.category.appendChild(o)}
    if(saved){
      if(saved.category==='all'||categories.some(c=>String(c.id)===String(saved.category)))els.category.value=saved.category;
      if(typeof saved.includeFantasy==='boolean')els.includeFantasy.checked=saved.includeFantasy;
      if(typeof saved.avoidRepeat==='boolean')els.avoidRepeat.checked=saved.avoidRepeat;
      if(Array.isArray(saved.drawn))drawn=[...new Set(saved.drawn.filter(id=>Number.isInteger(id)&&byId.has(id)))];
      if(Array.isArray(saved.timeline))timeline=saved.timeline.filter(id=>Number.isInteger(id)&&byId.has(id)).slice(-100);
      if(Number.isInteger(saved.current))current=byId.get(saved.current)||null;
    }
    // If fantasy alone was selected, retain access to its entries.
    if(els.category.value==='12')els.includeFantasy.checked=true;
    function pool(){return items.filter(x=>(els.category.value==='all'||x.category===Number(els.category.value))&&(els.includeFantasy.checked||x.category!==12))}
    function count(){
      const eligible=pool();const used=new Set(drawn);
      const available=eligible.filter(x=>!used.has(x.id)).length;
      const remainder=els.avoidRepeat.checked?available:eligible.length;
      els.remaining.textContent=`あと ${remainder} / ${eligible.length} 種類`;
      els.totalLabel.textContent=`${eligible.length}種類から抽選`;
    }
    function renderCurrent(animate=false){
      els.prompt.textContent=current?current.text:'ボタンを押して\nお題を引いてみよう';
      els.prompt.style.whiteSpace='pre-line';
      els.meta.replaceChildren();
      if(current){
        const badge1=document.createElement('span');badge1.className='pill no';badge1.textContent='#'+pad(current.id);
        const badge2=document.createElement('span');badge2.className='pill';badge2.textContent=byCategory.get(current.category).name;
        els.meta.append(badge1,badge2);
      }else{
        const badge=document.createElement('span');badge.className='pill';badge.textContent='全425種類のお題';els.meta.append(badge);
      }
      els.copyBtn.disabled=!current;
      els.backBtn.disabled=timeline.length<2;
      if(animate){els.card.classList.remove('enter');void els.card.offsetWidth;els.card.classList.add('enter')}
      count();renderHistory();save();
    }
    function renderHistory(){
      els.historyList.replaceChildren();
      const recent=timeline.slice(-5).reverse();
      if(!recent.length){const li=document.createElement('li');li.className='empty-history';li.textContent='まだお題はありません';els.historyList.append(li);return}
      for(const id of recent){const item=byId.get(id);if(!item)continue;
        const li=document.createElement('li');li.className='history-item';
        const no=document.createElement('span');no.className='num';no.textContent='#'+pad(id);
        const name=document.createElement('span');name.className='name';name.textContent=item.text;
        li.append(no,name);els.historyList.append(li)}
    }
    function toast(message){els.toast.textContent=message;els.toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>els.toast.classList.remove('show'),2100)}
    function randomIndex(size){if(size<=1)return 0;if(window.crypto&&crypto.getRandomValues){const array=new Uint32Array(1);const max=Math.floor(4294967296/size)*size;do{crypto.getRandomValues(array)}while(array[0]>=max);return array[0]%size}return Math.floor(Math.random()*size)}
    function draw(){
      let choices=pool();
      if(!choices.length){toast('この設定で選べるお題はありません');return}
      if(els.avoidRepeat.checked){
        const used=new Set(drawn);let remain=choices.filter(x=>!used.has(x.id));
        if(!remain.length){const all=new Set(choices.map(x=>x.id));drawn=drawn.filter(id=>!all.has(id));remain=choices;toast('一巡したので新しい周回へ ✨')}
        choices=remain;
      }else if(choices.length>1&&current){
        const other=choices.filter(x=>x.id!==current.id);if(other.length)choices=other;
      }
      current=choices[randomIndex(choices.length)];drawn.push(current.id);timeline.push(current.id);timeline=timeline.slice(-100);
      renderCurrent(true);
    }
    async function copy(){
      if(!current)return;
      const text=`#${pad(current.id)} ${current.text}（${byCategory.get(current.category).name}）`;
      try{if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(text)}else{const t=document.createElement('textarea');t.value=text;t.style.position='fixed';t.style.opacity='0';document.body.append(t);t.select();if(!document.execCommand('copy'))throw Error('copy failed');t.remove()}toast('お題をコピーしたよ ♡')}
      catch{toast('コピーできませんでした。お題を長押ししてね')}
    }
    $('drawBtn').addEventListener('click',draw);
    els.copyBtn.addEventListener('click',copy);
    els.backBtn.addEventListener('click',()=>{if(timeline.length<2)return;timeline.pop();current=byId.get(timeline.at(-1));renderCurrent(true)});
    els.category.addEventListener('change',()=>{if(els.category.value==='12')els.includeFantasy.checked=true;count();save()});
    els.includeFantasy.addEventListener('change',()=>{if(!els.includeFantasy.checked&&els.category.value==='12')els.category.value='all';count();save()});
    els.avoidRepeat.addEventListener('change',()=>{count();save()});
    $('resetBtn').addEventListener('click',()=>{drawn=[];timeline=[];current=null;renderCurrent();toast('抽選履歴をリセットしたよ')});
    renderCurrent();
  })();
  </script>
